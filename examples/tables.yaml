tables:
  - table:
      name: users
      count: 1000
      columns:
        - name: id
          type: integer
          domain: id
        - name: name
          type: string
          domain: name
        - name: age
          type: integer
          domain: age
        - name: email
          type: string
          domain: email
        - name: balance
          type: decimal
          scale: 10
          precision: 2
        - name: is_active
          type: boolean
        - name: created_at
          domain: datetime
        - name: updated_at
          domain: datetime
        - name: date_last_active
          domain: date
        - name: stuff
          type: string
          length: 100
  - table:
      name: customers
      columns:
        - name: id
          type: integer
          domain: id
        - name: name
          type: string
          domain: name
        - name: email
          type: string
          domain: email
        - name: is_active
          type: boolean
        - name: created_at
          domain: datetime
        - name: updated_at
          domain: datetime
        - name: date_last_active
          domain: date
